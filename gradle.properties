# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official

# ---- Varagh backend switch --------------------------------------------------------------
# false: fully offline app on the local database; no server code runs and no INTERNET permission.
# true:  Retrofit-backed repositories + sync + social/auth screens. Needs only a rebuild.
# Read by core/data/build.gradle.kts (BuildConfig.USE_REMOTE_BACKEND / API_BASE_URL) and by the app
# manifest setup. Override per build with -Pvaragh.useRemoteBackend=true
varagh.useRemoteBackend=false
varagh.apiBaseUrl=https://api.example.com/v1/

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
