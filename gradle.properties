# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official

# Varagh backend switch override (optional). The source of truth is the default inside
# core/data/build.gradle.kts. Uncomment, or pass -Pvaragh.useRemoteBackend=true, to flip it.
#varagh.useRemoteBackend=false
#varagh.apiBaseUrl=https://api.example.com/v1/
